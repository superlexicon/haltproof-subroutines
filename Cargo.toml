[workspace]
resolver = "2"
members = [
    "crates/hps-sdk",
    "crates/hps-client",
    "crates/cargo-hps",
    "examples/messaging",
    "examples/identity-registry",
    "examples/identity",
    "examples/corporate-charter",
    "examples/share-capital",
    "examples/authorization",
    "examples/asset-ledger",
    "examples/asset-pair-otc",
    "examples/product-ledger",
    "examples/accounting-ledger",
    "examples/dex-clob",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
