[workspace]
resolver = "2"
members = [
    "crates/isr-sdk",
    "crates/isr-client",
    "crates/cargo-isr",
    "examples/counter-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
