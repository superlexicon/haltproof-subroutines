[package]
name = "hps-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guest Rust SDK for authoring deterministic WebAssembly Haltproof Subroutines (HPS) on Lexicon"

[lib]
path = "src/lib.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
curve25519-dalek = "4"
ed25519-dalek = "2.0"
sha2 = "0.10"
