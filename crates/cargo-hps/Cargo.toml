[package]
name = "cargo-hps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI toolchain (`cargo hps`) to scaffold, compile, strip, validate, deploy, and invoke Lexicon Haltproof Subroutines (HPS)"

[[bin]]
name = "cargo-hps"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
ethereum-types = "0.14"
flate2 = "1.0"
hex = "0.4"
hps-client = { path = "../hps-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
