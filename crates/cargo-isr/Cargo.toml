[package]
name = "cargo-isr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI toolchain (`cargo isr`) to scaffold, compile, strip, validate, deploy, and invoke Lexicon Immortal Subroutines (ISRs)"

[[bin]]
name = "cargo-isr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
ethereum-types = "0.14"
hex = "0.4"
isr-client = { path = "../isr-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
